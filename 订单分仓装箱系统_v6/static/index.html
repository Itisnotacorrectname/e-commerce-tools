<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单分仓装箱系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d0f12;
  --surface:   #141720;
  --border:    #252a35;
  --border-hi: #3a4155;
  --text:      #c8cdd8;
  --text-dim:  #5a6070;
  --text-hi:   #eef0f5;
  --accent:    #f0a500;
  --accent-lo: rgba(240,165,0,0.12);
  --green:     #34c97b;
  --green-lo:  rgba(52,201,123,0.12);
  --red:       #f05252;
  --red-lo:    rgba(240,82,82,0.12);
  --blue:      #4a9eff;
  --blue-lo:   rgba(74,158,255,0.10);
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'Noto Sans SC', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-hi);
  letter-spacing: 0.04em;
}
.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  display: grid;
  place-items: center;
  font-size: 14px;
}
.logo-sub { color: var(--text-dim); font-weight: 400; }
.header-actions { display: flex; gap: 8px; }

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: 1fr;
  height: calc(100vh - 56px);
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-section {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}
.section-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 14px;
}

/* ── UPLOAD ZONE ── */
.upload-zone {
  border: 1px dashed var(--border-hi);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-lo);
}
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
}
.upload-icon {
  font-size: 28px;
  margin-bottom: 8px;
  display: block;
}
.upload-text { font-size: 13px; color: var(--text); }
.upload-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.upload-filename {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  margin-top: 8px;
  word-break: break-all;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 14px;
  height: 36px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  width: 100%;
}
.btn-primary:hover { background: #ffbb22; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border-hi);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger {
  background: transparent;
  color: var(--red);
  border-color: transparent;
  font-size: 11px;
  height: 28px;
  padding: 0 8px;
}
.btn-danger:hover { background: var(--red-lo); }
.btn-sm {
  height: 28px;
  font-size: 11px;
  padding: 0 10px;
}

/* ── HISTORY LIST ── */
.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-track { background: transparent; }
.history-list::-webkit-scrollbar-thumb { background: var(--border-hi); }

.history-item {
  padding: 12px;
  border: 1px solid var(--border);
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.history-item:hover { border-color: var(--border-hi); background: rgba(255,255,255,0.02); }
.history-item.active { border-color: var(--accent); background: var(--accent-lo); }
.history-ts {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.history-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.hstat {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
}
.hstat span { color: var(--accent); }
.history-item-actions {
  position: absolute;
  top: 8px; right: 8px;
  display: none;
  gap: 4px;
}
.history-item:hover .history-item-actions { display: flex; }
.badge {
  display: inline-block;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
}
.badge-warn { background: var(--red-lo); color: var(--red); }
.badge-ok   { background: var(--green-lo); color: var(--green); }

/* ── MAIN PANEL ── */
.main {
  overflow-y: auto;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: var(--border-hi); }

/* ── EMPTY STATE ── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--text-dim);
}
.empty-icon { font-size: 64px; opacity: 0.3; }
.empty-title { font-size: 18px; color: var(--text); font-weight: 500; }
.empty-desc { font-size: 13px; text-align: center; max-width: 320px; line-height: 1.7; }

/* ── PROGRESS ── */
.progress-panel {
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.progress-title {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
}
.progress-bar-wrap {
  width: 280px;
  height: 3px;
  background: var(--border);
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: var(--accent);
  animation: progress-anim 1.8s ease-in-out infinite;
  transform-origin: left;
}
@keyframes progress-anim {
  0%   { width: 0%; margin-left: 0; }
  50%  { width: 60%; margin-left: 20%; }
  100% { width: 0%; margin-left: 100%; }
}
.progress-log {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
}

/* ── RESULT HEADER ── */
.result-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.result-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.result-ts {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-hi);
  letter-spacing: -0.02em;
}

/* ── METRIC CARDS ── */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
}
.metric-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.metric-value {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 600;
  color: var(--text-hi);
  line-height: 1.1;
}
.metric-unit {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
}
.metric-card.accent  { border-color: var(--accent); }
.metric-card.green   { border-color: var(--green); }
.metric-card.red     { border-color: var(--red); }
.metric-card.accent .metric-value { color: var(--accent); }
.metric-card.green  .metric-value { color: var(--green); }
.metric-card.red    .metric-value { color: var(--red); }

/* ── CONTAINER TABLE ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
}
.panel-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12px;
}
th {
  text-align: left;
  padding: 10px 16px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.util-bar-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.util-bar {
  width: 80px;
  height: 4px;
  background: var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.util-fill {
  height: 100%;
  transition: width 0.4s ease;
}
.util-fill.ok   { background: var(--green); }
.util-fill.warn { background: var(--red); }
.util-pct { color: var(--text-hi); }

.wh-tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--blue-lo);
  color: var(--blue);
  font-size: 11px;
}
.low-tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--red-lo);
  color: var(--red);
  font-size: 11px;
}

/* ── WARNINGS ── */
.warnings-list {
  max-height: 260px;
  overflow-y: auto;
  padding: 8px 0;
}
.warning-item {
  padding: 8px 20px;
  font-size: 12px;
  border-left: 2px solid transparent;
  color: var(--text-dim);
  line-height: 1.6;
}
.warning-item.is-ok   { border-color: var(--green); color: var(--green); }
.warning-item.is-warn { border-color: var(--accent); color: var(--text); }
.warning-item.is-err  { border-color: var(--red); color: var(--red); }

/* ── WH SUMMARY GRID ── */
.wh-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  padding: 16px 20px;
}
.wh-card {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 14px;
}
.wh-name {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-hi);
  margin-bottom: 8px;
}
.wh-stat { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
.wh-stat strong { color: var(--text); font-weight: 500; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface);
  border: 1px solid var(--border-hi);
  padding: 12px 20px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-hi);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.25s;
  z-index: 999;
  max-width: 360px;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.err  { border-color: var(--red); color: var(--red); }
#toast.ok   { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">📦</div>
    <div>
      订单分仓装箱系统
      <span class="logo-sub"> / ALLOCATION ENGINE</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="downloadTemplate()">⬇ 下载输入模板</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">上传输入文件</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" accept=".xlsx" id="fileInput" onchange="onFileSelect(this)">
        <span class="upload-icon">📂</span>
        <div class="upload-text">点击选择或拖拽 Excel 文件</div>
        <div class="upload-hint">.xlsx 格式 · 需符合模板结构</div>
        <div class="upload-filename" id="uploadFilename"></div>
      </div>
      <div style="margin-top: 12px;">
        <button class="btn btn-primary" id="runBtn" onclick="runAllocation()" disabled>
          ▶ 开始运算
        </button>
      </div>
    </div>

    <div class="sidebar-section" style="padding-bottom: 8px;">
      <div class="section-label">历史批次</div>
    </div>
    <div class="history-list" id="historyList">
      <div style="text-align:center;padding:24px;color:var(--text-dim);font-size:12px;">
        暂无历史记录
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗂</div>
      <div class="empty-title">等待输入文件</div>
      <div class="empty-desc">
        上传填写好的 Excel 输入文件，系统将自动计算分仓比例并优化集装箱装箱方案。
        <br><br>
        <a href="#" onclick="downloadTemplate();return false" style="color:var(--accent);">点击下载空白模板 →</a>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────
let selectedFile = null;
let currentBatch = null;

// ── Init ──────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadHistory();
  setupDragDrop();
});

function setupDragDrop() {
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.name.endsWith('.xlsx')) setFile(f);
    else toast('请选择 .xlsx 格式文件', 'err');
  });
}

// ── File Select ───────────────────────────────
function onFileSelect(input) {
  if (input.files[0]) setFile(input.files[0]);
}

function setFile(f) {
  selectedFile = f;
  document.getElementById('uploadFilename').textContent = '📄 ' + f.name;
  document.getElementById('runBtn').disabled = false;
}

// ── Run ───────────────────────────────────────
async function runAllocation() {
  if (!selectedFile) return;

  const btn = document.getElementById('runBtn');
  btn.disabled = true;

  showProgress();

  const fd = new FormData();
  fd.append('file', selectedFile);

  try {
    const res = await fetch('/api/run', { method: 'POST', body: fd });
    const data = await res.json();

    if (!res.ok) {
      toast(data.error || '运算失败', 'err');
      showEmpty();
      btn.disabled = false;
      return;
    }

    currentBatch = data.batch_ts;
    renderResult(data.summary);
    loadHistory();
    toast('✅ 运算完成，点击下载报告', 'ok');
  } catch (e) {
    toast('网络错误: ' + e.message, 'err');
    showEmpty();
  }

  btn.disabled = false;
}

// ── Render Progress ───────────────────────────
function showProgress() {
  const main = document.getElementById('mainPanel');
  main.innerHTML = `
    <div class="progress-panel">
      <div class="progress-title">▶ 运算中...</div>
      <div class="progress-bar-wrap"><div class="progress-bar"></div></div>
      <div class="progress-log">正在计算分仓比例与装箱方案</div>
    </div>`;
}

function showEmpty() {
  document.getElementById('mainPanel').innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗂</div>
      <div class="empty-title">等待输入文件</div>
      <div class="empty-desc">上传填写好的 Excel 输入文件，系统将自动计算分仓比例并优化集装箱装箱方案。</div>
    </div>`;
}

// ── Render Result ─────────────────────────────
function renderResult(s) {
  const lowClass = s.low_util_count === 0 ? 'green' : s.low_util_count === 1 ? 'accent' : 'red';
  const utilClass = s.avg_utilization >= 98 ? 'green' : s.avg_utilization >= 90 ? 'accent' : 'red';

  // Group containers by warehouse
  const whMap = {};
  (s.container_summary || []).forEach(c => {
    if (!whMap[c.warehouse]) whMap[c.warehouse] = [];
    whMap[c.warehouse].push(c);
  });

  const whCards = Object.entries(whMap).map(([wh, cts]) => {
    const avg = (cts.reduce((a,c) => a + c.utilization, 0) / cts.length).toFixed(1);
    const lows = cts.filter(c => c.is_low).length;
    return `
      <div class="wh-card">
        <div class="wh-name">${wh}</div>
        <div class="wh-stat">集装箱 <strong>${cts.length} 个</strong></div>
        <div class="wh-stat">平均利用率 <strong>${avg}%</strong></div>
        ${lows ? `<div class="wh-stat" style="color:var(--red)">低利用率箱 ${lows} 个</div>` : ''}
      </div>`;
  }).join('');

  const containerRows = (s.container_summary || []).map(c => {
    const cls = c.utilization >= 98 ? 'ok' : 'warn';
    return `
      <tr>
        <td style="font-weight:600;color:var(--text-hi)">${c.id}</td>
        <td><span class="wh-tag">${c.warehouse}</span></td>
        <td>
          <div class="util-bar-wrap">
            <div class="util-bar"><div class="util-fill ${cls}" style="width:${Math.min(c.utilization,100)}%"></div></div>
            <span class="util-pct ${c.is_low ? 'low-tag' : ''}">${c.utilization}%</span>
          </div>
        </td>
        <td>${c.used_vol} m³</td>
        <td>${c.sku_count} 种</td>
        <td>${c.is_low ? '<span class="low-tag">⚠ 低利用率</span>' : '<span style="color:var(--green)">✓ 正常</span>'}</td>
      </tr>`;
  }).join('');

  const warnItems = (s.warnings || []).map(w => {
    let cls = 'is-warn';
    if (w.startsWith('✅')) cls = 'is-ok';
    else if (w.includes('⚠️') || w.startsWith('⚠')) cls = 'is-err';
    return `<div class="warning-item ${cls}">${w}</div>`;
  }).join('');

  const fmtTs = ts => {
    const y=ts.slice(0,4), mo=ts.slice(4,6), d=ts.slice(6,8);
    const h=ts.slice(9,11), mi=ts.slice(11,13), sec=ts.slice(13,15);
    return `${y}-${mo}-${d} ${h}:${mi}:${sec}`;
  };

  document.getElementById('mainPanel').innerHTML = `
    <div class="result-header">
      <div>
        <div class="result-title">批次结果</div>
        <div class="result-ts">${fmtTs(s.batch_ts)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <button class="btn btn-ghost" onclick="downloadInput('${s.batch_ts}')">⬇ 输入存档</button>
        <button class="btn btn-primary" onclick="downloadReport('${s.batch_ts}')">⬇ 下载报告</button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card accent">
        <div class="metric-label">集装箱总数</div>
        <div class="metric-value">${s.container_count} <span class="metric-unit">个</span></div>
      </div>
      <div class="metric-card ${utilClass}">
        <div class="metric-label">平均利用率</div>
        <div class="metric-value">${s.avg_utilization}<span class="metric-unit">%</span></div>
      </div>
      <div class="metric-card ${lowClass}">
        <div class="metric-label">低利用率箱</div>
        <div class="metric-value">${s.low_util_count} <span class="metric-unit">个</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">总分配件数</div>
        <div class="metric-value">${s.total_allocated.toLocaleString()} <span class="metric-unit">件</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">SKU 数量</div>
        <div class="metric-value">${s.order_sku_count} <span class="metric-unit">种</span></div>
      </div>
      <div class="metric-card ${s.warning_count > 0 ? 'red' : 'green'}">
        <div class="metric-label">警告数量</div>
        <div class="metric-value">${s.warning_count} <span class="metric-unit">条</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">仓库分布</div>
      </div>
      <div class="wh-grid">${whCards}</div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">集装箱明细</div>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim)">
          共 ${s.container_count} 个集装箱
        </span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>箱号</th><th>目标仓库</th><th>利用率</th>
              <th>装载体积</th><th>SKU种数</th><th>状态</th>
            </tr>
          </thead>
          <tbody>${containerRows}</tbody>
        </table>
      </div>
    </div>

    ${(s.warnings||[]).length > 0 ? `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">运行日志 / 警告</div>
        <span class="badge ${s.warnings.filter(w=>!w.startsWith('✅')).length > 0 ? 'badge-warn' : 'badge-ok'}">
          ${s.warnings.length} 条
        </span>
      </div>
      <div class="warnings-list">${warnItems}</div>
    </div>` : ''}
  `;
}

// ── History ───────────────────────────────────
async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    renderHistory(data);
  } catch {}
}

function renderHistory(batches) {
  const el = document.getElementById('historyList');
  if (!batches.length) {
    el.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-dim);font-size:12px;">暂无历史记录</div>`;
    return;
  }

  const fmtTs = ts => {
    const y=ts.slice(0,4), mo=ts.slice(4,6), d=ts.slice(6,8);
    const h=ts.slice(9,11), mi=ts.slice(11,13);
    return `${y}-${mo}-${d} ${h}:${mi}`;
  };

  el.innerHTML = batches.map(b => `
    <div class="history-item ${currentBatch === b.batch_ts ? 'active' : ''}"
         data-ts="${b.batch_ts}">
      <div class="history-ts">${fmtTs(b.batch_ts)}</div>
      <div class="history-stats">
        <div class="hstat"><span>${b.container_count}</span> 箱</div>
        <div class="hstat"><span>${b.avg_utilization}%</span> 利用率</div>
        <div class="hstat"><span>${b.total_allocated}</span> 件</div>
      </div>
      <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">
        ${(b.warehouses||[]).map(w => `<span class="wh-tag" style="font-size:10px">${w}</span>`).join('')}
        ${b.low_util_count > 1 ? `<span class="badge badge-warn">⚠ ${b.low_util_count}低利用率</span>` : ''}
      </div>
      <div class="history-item-actions">
        <button class="btn btn-ghost btn-sm" data-action="report" data-ts="${b.batch_ts}">报告</button>
        <button class="btn btn-danger" data-action="delete" data-ts="${b.batch_ts}">✕</button>
      </div>
    </div>
  `).join('');

  // 事件委托：一次绑定处理所有历史条目的点击
  el.onclick = async (e) => {
    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      const ts  = actionBtn.dataset.ts;
      const act = actionBtn.dataset.action;
      if (act === 'report') { downloadReport(ts); return; }
      if (act === 'delete') { await deleteBatch(ts); return; }
    }
    const item = e.target.closest('.history-item[data-ts]');
    if (item) loadBatch(item.dataset.ts);
  };
}

async function loadBatch(ts) {
  currentBatch = ts;
  // 重新从服务器取最新 meta，不依赖内嵌数据
  try {
    const res = await fetch('/api/history');
    const all  = await res.json();
    const meta = all.find(b => b.batch_ts === ts);
    if (meta) {
      renderResult(meta);
    } else {
      toast('批次数据不存在', 'err');
    }
  } catch {
    toast('加载批次失败', 'err');
  }
  // 更新侧边栏高亮
  document.querySelectorAll('.history-item').forEach(el => {
    el.classList.toggle('active', el.dataset.ts === ts);
  });
}

async function deleteBatch(ts) {
  if (!confirm('确认删除该批次存档？此操作不可恢复。')) return;
  const res = await fetch(`/api/history/${ts}`, { method: 'DELETE' });
  if (res.ok) {
    if (currentBatch === ts) { showEmpty(); currentBatch = null; }
    loadHistory();
    toast('已删除');
  } else {
    toast('删除失败', 'err');
  }
}

// ── Downloads ─────────────────────────────────
function downloadTemplate() {
  window.location.href = '/api/template';
}
function downloadReport(ts) {
  window.location.href = `/api/download/${ts}`;
}
function downloadInput(ts) {
  window.location.href = `/api/download-input/${ts}`;
}

// ── Toast ─────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type === 'err' ? 'err' : type === 'ok' ? 'ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3500);
}
</script>
</body>
